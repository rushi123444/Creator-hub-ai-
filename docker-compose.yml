# docker compose up --build            -> frontend (http://localhost:5173) + backend (http://localhost:8000), SQLite
# docker compose --profile postgres up -> also starts local Postgres (set POSTGRES_PASSWORD and DATABASE_URL in .env)
services:
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports: ["8000:8000"]
    volumes: [backend_data:/app/data]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    ports: ["5173:80"]
    depends_on: [backend]
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creatorhub
      POSTGRES_USER: creatorhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
volumes:
  backend_data:
  pg_data:
