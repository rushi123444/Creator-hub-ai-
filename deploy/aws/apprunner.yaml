# AWS App Runner, source-based (GitHub repo, source directory: backend). Verify supported runtime versions in AWS docs.
version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip install -r requirements.txt
run:
  command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
  env:
    - name: APP_ENV
      value: production
    - name: AUTO_SEED
      value: "false"
  # Secrets: reference Secrets Manager / SSM Parameter Store ARNs (instance role needs read access).
  secrets:
    - name: JWT_SECRET
      value-from: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:creatorhub/jwt-secret"
    - name: DATABASE_URL
      value-from: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:creatorhub/database-url"
    - name: OPENAI_API_KEY
      value-from: "arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:creatorhub/openai-api-key"
